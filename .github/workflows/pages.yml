name: Publicera webbversionen

# Bygger PWA:n och lägger ut den på GitHub Pages vid varje ändring i main,
# till exempel en uppdaterad kommunlista.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href /parkeringsvaljaren/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicera.outputs.page_url }}
    steps:
      - id: publicera
        uses: actions/deploy-pages@v4
