name: Bygg APK

# Bygger Android-appen och lägger APK-filen som en release i GitHub.
#
# - Pusha en tagg som v1.0.0 → release med APK-filen, signerad med
#   släppnyckeln. Versionsnumret tas från taggen och byggnumret från
#   körningens nummer, så att varje APK går att installera över den förra.
# - Pull request som ändrar Android-delen → bygget provas, ingen release.
# - Kör för hand (Actions → Bygg APK → Run workflow) → APK-filen läggs bara
#   som nedladdning på körningen. Utan släppnyckel signeras den med en
#   debugnyckel och går inte att uppdatera med en riktig release.
#
# Släppnyckeln ligger i repots hemligheter (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64  nyckelfilen (.jks), base64-kodad
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Spara en kopia av nyckelfilen och lösenorden utanför GitHub. Hemligheter
# går inte att läsa tillbaka, och utan samma nyckel kan appen inte
# uppdateras på telefonerna.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: Släppnyckel
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::Släppnyckeln saknas. Lägg in hemligheterna ANDROID_KEYSTORE_BASE64 m.fl. (se början av apk.yml)."
              exit 1
            fi
            echo "::warning::Släppnyckeln saknas. APK-filen signeras med en debugnyckel."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/slapp.jks"
          {
            echo "storeFile=$RUNNER_TEMP/slapp.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Bygg
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            flutter build apk --release \
              --build-name "${GITHUB_REF_NAME#v}" \
              --build-number "$GITHUB_RUN_NUMBER"
          else
            flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk parkeringsvaljaren.apk

      - uses: actions/upload-artifact@v4
        with:
          name: parkeringsvaljaren-apk
          path: parkeringsvaljaren.apk

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" parkeringsvaljaren.apk \
            --title "Parkeringsväljaren $GITHUB_REF_NAME" \
            --generate-notes
